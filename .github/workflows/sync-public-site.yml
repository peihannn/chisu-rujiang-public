name: Sync clean public site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: peihannn/chisu-rujiang
          path: source

      - name: Copy only the public website
        shell: bash
        run: |
          cp -R source/xhs-dist/. .
          touch .nojekyll

      - name: Commit synchronized site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html app.js audio-data.js assets
          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit -m "Publish clean storytelling prototype"
          git push
